name: Release

on:
  push:
    tags:
      - 'v*' # Trigger on tags starting with 'v' (e.g., v1.2.3)

jobs:
  build-and-publish:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pin the build toolchain so every matrix cell lints with the same ruff:
          # each hatch release bundles its own ruff, and different ruff versions disagree
          # on rules such as N802. (Python 3.9 was dropped with the vastdb 2.x SDK, so a
          # newer hatch would now install, but bumping it means re-checking the rule set.)
          # virtualenv is capped because hatch calls
          # virtualenv.discovery.builtin.propose_interpreters, which virtualenv 21 removed.
          pip install "hatch==1.15.1" hatchling "virtualenv<21"

      - name: Check Formatting
        run: hatch fmt --check

      - name: Run tests
        run: hatch test

      - name: Build NAR
        run: hatch build -t custom

      - name: Ensure dist directory exists
        run: mkdir -p dist

      - name: List built artifacts
        run: ls -l dist

      - name: Upload NAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: nar-files-${{ matrix.os }}-${{ matrix.python-version }}
          path: dist/*.nar

  create-release:
    needs: build-and-publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Move all NAR files to dist
        run: |
          mkdir -p dist
          find artifacts -name "*.nar" -exec mv {} dist/ \;

      - name: Verify downloaded artifacts
        run: ls -l dist || echo "No artifacts found!"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*.nar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
