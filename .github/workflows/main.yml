name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Pin the build toolchain so every matrix cell lints with the same ruff.
        # hatch dropped Python 3.9 at 1.16.0, so an unpinned install silently gives
        # the 3.9 jobs an older hatch (and older ruff) than the rest, and the two
        # disagree on rules such as N802. 1.15.1 is the newest hatch covering 3.9-3.11.
        # virtualenv is capped because hatch calls
        # virtualenv.discovery.builtin.propose_interpreters, which virtualenv 21 removed.
        pip install "hatch==1.15.1" "virtualenv<21"
    - name: Check Formatting
      run: hatch fmt --check
    - name: Run tests
      run: hatch test
    - name: Build
      run: hatch build -t custom
    - name: Get NAR filename
      id: get_nar_filename
      run: |
        nar_filename=$(basename $(ls dist/*.nar)) # Extract only the filename
        echo "nar_filename=${nar_filename}" >> $GITHUB_OUTPUT
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.get_nar_filename.outputs.nar_filename }}
        path: dist/*.nar
