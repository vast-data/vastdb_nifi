name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Pin the build toolchain so every matrix cell lints with the same ruff:
        # each hatch release bundles its own ruff, and different ruff versions disagree
        # on rules such as N802. (Python 3.9 was dropped with the vastdb 2.x SDK, so a
        # newer hatch would now install, but bumping it means re-checking the rule set.)
        # virtualenv is capped because hatch calls
        # virtualenv.discovery.builtin.propose_interpreters, which virtualenv 21 removed.
        pip install "hatch==1.15.1" "virtualenv<21"
    - name: Check Formatting
      run: hatch fmt --check
    - name: Run tests
      run: hatch test
    - name: Build
      run: hatch build -t custom
    - name: Get NAR filename
      id: get_nar_filename
      run: |
        nar_filename=$(basename $(ls dist/*.nar)) # Extract only the filename
        echo "nar_filename=${nar_filename}" >> $GITHUB_OUTPUT
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.get_nar_filename.outputs.nar_filename }}
        path: dist/*.nar
